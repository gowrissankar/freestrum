<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeStrum </title>
  <link rel="stylesheet" href="./src/style.css">
</head>


<body>
  <!-- Minimalist dark preloader -->
  <div id="preloader">
    <div class="preloader-content">
      <div class="preloader-title">FreeStrum</div>
      <div class="preloader-subtitle">Initializing System</div>
      <div class="preloader-steps">
        <div class="step" id="step-camera">
          <span class="step-dot"></span>
          <span class="step-text">Connecting Webcam</span>
        </div>
        <div class="step" id="step-vision">
          <span class="step-dot"></span>
          <span class="step-text">Loading Hand Tracking AI</span>
        </div>
        <div class="step" id="step-audio">
          <span class="step-dot"></span>
          <span class="step-text">Buffering Guitar Strings</span>
        </div>
      </div>
    </div>
  </div>

  <div id="app">
    <!-- The camera video feed, mirror canvas, and UI elements will be loaded here -->
    <video id="webcam" autoplay playsinline></video>
    <canvas id="overlay"> </canvas>

    <!-- Dashboard Panel -->
    <div id="dashboard">
      <div class="panel-section" style="gap: 15px; flex: 1.5;">
        <button id="capo-down">-</button>
        <div class="center" style="align-items: flex-start; min-width: 50px;">
          <span class="label">Capo</span>
          <span class="value" id="capo-display">0</span>
        </div>
        <button id="capo-up">+</button>

        <!-- Relative/Absolute Toggle Button -->
        <button id="chord-mode-toggle" style="width: auto; border-radius: 20px; padding: 0 15px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; margin-left: 10px;">
          Show: Original
        </button>

        <!-- Table Size Controls -->
        <div style="display: flex; align-items: center; gap: 8px; margin-left: 10px;">
          <button id="size-down">-</button>
          <div class="center" style="align-items: flex-start; min-width: 60px;">
            <span class="label">Grid Size</span>
            <span class="value" id="size-display">100%</span>
          </div>
          <button id="size-up">+</button>
        </div>
      </div>

      <div class="panel-section center">
        <span class="label">Current Chord</span>
        <span class="value highlight" id="chord-display">--</span>
      </div>

      <div class="panel-section right">
        <div class="center" style="align-items: flex-end">
          <span class="label">Right Hand State</span>
          <span class="value" id="state-display">Rest</span>
        </div>
      </div>
    </div>

  </div>
  <script type="module" src="./src/main.js"></script>
</body>

</html>
